# MiniCPM5's instruct-mode (no thinking) profile.

label: minicpm5_instruct

temperature: 0.7
top_p: 0.95
top_k: -1                  # vLLM's own neutral default, written out
min_p: 0.0                  # rather than omitted.
presence_penalty: 0.0
repetition_penalty: 1.0
max_tokens: 8192

# Not cited in tool-call's own (partial) profile -- CATALOG Section 4.1
# and RESEARCH Section 16.3 both omit enable_thinking from their tables.
# Inferred from the profile name ("_instruct"), not read from
# tool-call's models.yaml. Revisit if that config is ever consulted
# directly.
enable_thinking: false

seed: 42   # S-D6.

