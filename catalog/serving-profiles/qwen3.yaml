# columns, verbatim, by 77be30708294::_backfill_seeded_profile. This file
# must hash to a0e36aad24ce96dc -- if it doesn't, the loader finds no row
# for the new hash, then finds the label `qwen3` already taken, and
# reports a conflict (S-T2, docs/STANDARDS_AND_PROFILES_PHASES.md).
