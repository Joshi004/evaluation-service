# catalog/standards/ifeval-v1.yaml
#
# IFEval. Protocol only, as of docs/STANDARDS_AND_PROFILES_PHASES.md
# Phase 3 -- sampling moved off this file entirely, onto
# sampling_profile. What used to be two standards here
# (ifeval-v1-instruct.yaml, ifeval-v1-think.yaml, differing only in
# their sampling block) is now one: the instruct/think distinction is
# which sampling profile a submit picks (`greedy` versus
# `qwen3_think`), not which standard it targets.

label: ifeval/v1

# --- Protocol --------------------------------------------------------------

benchmark: ifeval
framework: evalscope
framework_image: registry.local/evalscope:2ce95c3-tier1
# -tier1: Phase 5 (docs/STANDARDS_AND_PROFILES_PHASES.md, S-D31) rebuilds
# this image with four more datasets baked in (IFBench, GSM8K,
# GPQA-Diamond, MMLU-Pro) -- same pinned EvalScope commit
# (2ce95c314ed379a...), same IFEval dataset snapshot, but decision D3
# makes the tag itself the dataset pin, so the tag changes with the set
# even though nothing about IFEval's own measurement did. This is a
# hashed field, so it mints a new standard row; there is no reference
# score change to make because of it.
task_name: ifeval

dataset_name: opencompass/ifeval
# Source: EvalScope's own adapter registration, confirmed from a real
# resolved task_config.yaml. NOT "google/IFEval" -- that's the paper's
# release, a different id from the ModelScope mirror EvalScope fetches.

dataset_revision: null
# Decision D3, confirmed 8 Sep. EvalScope's dataset_args expose no revision
# knob for a ModelScope-hosted set, so there is no real value to put here.
# The column is nullable for exactly this case: null says "we don't have
# one" rather than standing in a fake pin. Revisit the day a real revision
# string exists -- setting it then is a new standard row, like any other
# field change.

split: train            # source: EvalScope. IFEval ships one split, oddly named "train".
train_split: null
# IFEval is 0-shot (few_shot: 0 below) -- there is no few-shot source
# split to name. Verified against the pinned commit's own
# BenchmarkMeta registration: IFEval sets no train_split at all.
few_shot: 0             # source: paper and EvalScope agree.
prompt_template: ""     # source: paper and EvalScope agree -- no wrapper at all.
# The empty template isn't cosmetic: IFEval's instructions include things
# like "respond in all lowercase", so any wrapper we added could itself
# violate the instruction under test.
few_shot_prompt_template: null
# Only takes effect once few_shot > 0 (DefaultDataAdapter.format_fewshot_template);
# IFEval is 0-shot, so there is nothing here to set.

extraction:
  method: none
  # source: EvalScope. IFEval's checkers run against the raw completion;
  # there is no separate answer-extraction step for this benchmark.

metrics:
  - name: prompt_level_strict
    display_name: "Prompt-level (strict)"
    harness_key: "prompt_level_strict:mean"
    higher_is_better: true
    is_primary: true
    harness_options: {}
  - name: inst_level_strict
    display_name: "Instruction-level (strict)"
    harness_key: "inst_level_strict:mean"
    higher_is_better: true
    is_primary: false
    harness_options: {}
  - name: prompt_level_loose
    display_name: "Prompt-level (loose)"
    harness_key: "prompt_level_loose:mean"
    higher_is_better: true
    is_primary: false
    harness_options: {}
  - name: inst_level_loose
    display_name: "Instruction-level (loose)"
    harness_key: "inst_level_loose:mean"
    higher_is_better: true
    is_primary: false
    harness_options: {}
  # harness_key is the key inside the report's raw.<task>.metrics block --
  # verified against a real report.json. EvalScope's key has no "_acc" and
  # is colon-separated; "prompt_level_strict_acc,none" is lm-eval's format.
  # harness_options is {} on every metric here -- all four registered as
  # bare names in EvalScope's own metric_list, none carrying scorer kwargs
  # (Phase 5; contrast GSM8K's accuracy, which needs numeric: true).

repeats: 1
# source: our decision. IFEval's own 95% CI at n=541 is already +/-4 points;
# repeats is for the small benchmarks, not this one.

sample_limit: null   # null = the full 541 prompts. Never null on a published run.

# --- Grading -----------------------------------------------------------------

think_handling: strip
# "strip" here is mechanical, not a text filter: it requires the serving
# profile to carry --reasoning-parser qwen3 whenever the picked sampling
# profile has enable_thinking: true (e.g. qwen3_think) -- with that flag
# vLLM splits <think>...</think> into a separate reasoning_content field
# before EvalScope sees the response, so the content being scored is
# already think-free. Under a sampling profile with enable_thinking: false
# (e.g. greedy) there is no think block to strip in the first place, so
# the same setting is simply inert (Trap T5 of Phase 2; Section 10 item 3
# of docs/CHECKPOINT_REGISTRATION_PHASES.md) -- this coupling is invisible
# if you only look at one table.

sampling_overrides: {}
# IFEval's own published definition mandates nothing about sampling --
# the instruct/think distinction that used to be two separate standards
# is now just which sampling profile a submit picks.

# --- Operational -------------------------------------------------------------

subsets: ["default"]
# IFEval registers one subset under EvalScope, named literally "default" --
# unlike BFCL or tau2, there is no real split to name here. Hashed (Phase 4):
# this is the field that makes which samples ran part of the standard's
# identity, so a standard with a real subset list (e.g. tau2_retail vs
# tau2_telecom) is expressible at all. The list is passed to EvalScope
# verbatim and in the order written, not sorted -- reordering it is a
# content change and therefore a new hash, same as any other field here.

eval_batch_size: 32
# Requests in flight, not hashed (S-D7) -- purely a throughput knob, never
# part of what's measured. 32 is right-sized for IFEval specifically: the
# tool-call team's own measurement (RESEARCH §13) found it leaves the GPU
# idle on a benchmark like MMLU-Pro (2,179 tok/s at batch 32 vs. 3,950 at
# 128) and is too high for BFCL/ACEBench's multi-turn subsets, where the
# bottleneck is Python in the worker rather than the GPU -- which is exactly
# why this is a per-standard column instead of one global constant.

request_timeout_seconds: 1800
# Per-request timeout, not hashed (S-D7). EvalScope's own field is the bare
# "timeout"; renamed on the way into this schema (S-D26) because the system
# already has two other timeouts (slurm_walltime_seconds, the SSH
# connector's 60s command timeout) and the unqualified name invites editing
# the wrong one. 30 minutes is ample for IFEval's short, single-turn
# prompts -- long-form benchmarks like AIME25 or MATH-500 will need theirs
# set far higher when they're added.

# --- Provenance --------------------------------------------------------------
# Was two files, ifeval-v1-instruct.yaml (label ifeval/v1-instruct) and
# ifeval-v1-think.yaml (label ifeval/v1-think), collapsed into this one
# by docs/STANDARDS_AND_PROFILES_PHASES.md Phase 3 (S-D12): sampling
# moved to sampling_profile, leaving both files with an identical
# protocol block and nothing left to distinguish them by.
#
# Collision note (S-D28, Phase 5; RESEARCH §8): IFEval is the widest
# collision this system ships -- three teams (tool-call, medpsy,
# one-bit), two harnesses (EvalScope here, lm-eval for the other two).
# Tool-call/EvalScope is canonical (owner/incumbent, §8's tie-break);
# settling it with real data rather than opinion is the lm-eval
# adapter's job (a later milestone), not this file's.
