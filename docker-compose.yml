# Evaluation Service — local development stack.
#
# Three services, mapped to the local filesystem, per the tech stack in
# EVAL_SERVICE_PLAN.md (Section 16):
#   - postgres   the source of truth (Section 10 — data model)
#   - backend    FastAPI control-plane API, source bind-mounted for reload
#   - frontend   React + Vite UI, source bind-mounted for hot reload
#
# Redis was dropped (decision D1, docs/IMPLEMENTATION_PHASES.md) -- v1 has
# no reconciler, no locks, and no live streaming, so nothing needs it.
#
# Quick start:
#   cp .env.example .env
#   docker compose up --build
#
# All ${VAR:-default} values below work even without a .env file — copying
# the example is only needed if you want to change a default (e.g. a port
# that's already taken on your machine).

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eval_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eval_service}
      POSTGRES_DB: ${POSTGRES_DB:-eval_service}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-eval_service}:${POSTGRES_PASSWORD:-eval_service}@postgres:5432/${POSTGRES_DB:-eval_service}
      # The cluster (Phase 3). Settings(env_file=".env") reads /app/.env
      # *inside the container*, which doesn't exist -- the real .env lives
      # at the repo root, outside the ./backend bind mount below. So, same
      # as DATABASE_URL above, each value has to be passed through
      # explicitly for an edit to .env to actually reach the app.
      CLUSTER_SSH_HOST: ${CLUSTER_SSH_HOST:-login-6}
      CLUSTER_SSH_USER: ${CLUSTER_SSH_USER:-naresh}
      CLUSTER_SSH_PORT: ${CLUSTER_SSH_PORT:-22}
      CLUSTER_PROXY_JUMP: ${CLUSTER_PROXY_JUMP:-login-6}
      SLURM_PARTITION: ${SLURM_PARTITION:-main}
      SLURM_WALLTIME_SECONDS: ${SLURM_WALLTIME_SECONDS:-7200}
      CLUSTER_LOG_ROOT: ${CLUSTER_LOG_ROOT:-/home/shared/eval-service/logs}
      # Discovery (Phase 2 of CHECKPOINT_REGISTRATION_PHASES.md).
      CLUSTER_MODELS_ROOT: ${CLUSTER_MODELS_ROOT:-/home/shared/agentic_slm/models}
      DISCOVERY_MAX_DEPTH: ${DISCOVERY_MAX_DEPTH:-2}
      # Fixed container-side paths -- not meant to vary. What varies is
      # where they're mounted FROM, below.
      CLUSTER_SSH_KEY_PATH: /secrets/cluster_ssh_key
      CLUSTER_SSH_KNOWN_HOSTS_PATH: /root/.ssh/known_hosts
      # The harness (Phase 4). Same "compose doesn't forward .env into
      # the container" reason as above -- each value is passed through
      # explicitly rather than relying on Settings(env_file=".env").
      # Must resolve to an ABSOLUTE path, unlike the volume line below:
      # runner.py hands this string straight to a nested `docker run -v`
      # from inside this container, and that bind-mount source is
      # resolved by the HOST daemon, which has no idea what this
      # container's own working directory means. ${PWD} is the
      # directory `docker compose` itself was run from -- the repo
      # root, by the same convention every other relative path in this
      # file already assumes.
      OUTPUT_ROOT_HOST_PATH: ${OUTPUT_ROOT_HOST_PATH:-${PWD}/runs}
      HARNESS_IMAGE: ${HARNESS_IMAGE:-registry.local/evalscope:2ce95c3}
      HARNESS_DOCKER_NETWORK: ${HARNESS_DOCKER_NETWORK:-evaluation-service_default}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./standards:/standards:ro
      # Neither has a meaningful default (unlike the ports/passwords
      # above) -- both must be set in .env to real absolute paths before
      # cluster access works. The /dev/null fallback keeps `docker compose
      # up` working with zero cluster setup (Phases 1-2's guarantee):
      # mounting it is harmless, and only an actual SSH attempt would ever
      # notice, with a clear I/O error rather than a compose-level failure.
      - ${CLUSTER_SSH_KEY_HOST_PATH:-/dev/null}:/secrets/cluster_ssh_key:ro
      - ${CLUSTER_SSH_KNOWN_HOSTS_HOST_PATH:-/dev/null}:/root/.ssh/known_hosts:ro
      # The harness (Phase 4). The backend spawns harness containers as
      # siblings via the host Docker daemon -- not children -- so it
      # needs the daemon's own socket, not a nested Docker-in-Docker
      # setup. ./runs is a host directory, not a named volume: `docker
      # compose down -v` must never take a run's predictions with it
      # (see harness/evalscope's own module docstrings).
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OUTPUT_ROOT_HOST_PATH:-./runs}:/data/evalsvc/runs
    depends_on:
      postgres:
        condition: service_healthy

  # Built by `docker compose build harness` (part of the stack's normal
  # build story) but never started by a plain `docker compose up` --
  # the backend spawns short-lived containers from this image itself,
  # one per eval run (app/services/harness/runner.py).
  harness:
    build: ./harness/evalscope
    image: ${HARNESS_IMAGE:-registry.local/evalscope:2ce95c3}
    profiles: ["build-only"]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
